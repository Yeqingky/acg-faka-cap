name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate tag and plugin version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vX.Y.Z: $RELEASE_TAG" >&2
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          expected="Plugin::VERSION => '$version'"
          if ! grep -Fq "$expected" Capcaptcha/Config/Info.php; then
            echo "Release tag $RELEASE_TAG does not match Capcaptcha/Config/Info.php" >&2
            exit 1
          fi

      - name: Build plugin archive
        id: package
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          archive="Capcaptcha-${RELEASE_TAG}.zip"
          git archive --format=zip "$GITHUB_SHA" Capcaptcha > "$archive"

          if ! unzip -Z1 "$archive" | grep -q '^Capcaptcha/'; then
            echo "Archive is missing the Capcaptcha directory" >&2
            exit 1
          fi
          if unzip -Z1 "$archive" | grep -Ev '^Capcaptcha/' | grep -q .; then
            echo "Archive contains files outside the Capcaptcha directory" >&2
            exit 1
          fi
          if unzip -Z1 "$archive" | grep -q '^Capcaptcha/Capcaptcha/'; then
            echo "Archive contains a duplicated Capcaptcha directory" >&2
            exit 1
          fi

          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Capcaptcha ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.package.outputs.archive }}
